project:
  output-dir: docs
  type: website

website:
  sidebar:
    style: "floating"
    search: false
    contents:
      - text: "Report overview"
        href: index.qmd
      - section: "Mixed Linear Regression analysis"
        contents:
          - text: "Basic Menzerath-Altman model"
            href: main_analysis_1.qmd
            
metadata:
  crossref:
    chapters: true

bibliography: quarto_dependencies/references/refs.bib
theme: yeti

format:
  html:
    toc: true
    fontsize: 12px
    max-width: 8000px
    toc-location: left
    toc-title: "Contents"
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: true
    css: |
      .quarto-container {
        max-width: 8000px !important;
      }
      body {
        font-size: 10px;
      }

engine: quarto